# yaml-language-server: $schema=./values.schema.json

global:
  domain: c-881e383.kyma.ondemand.com
  imagePullSecret:
    name: docker-registry
  image:
    registry: docker.io
    tag: v11
srv:
  bindings:
    auth:
      serviceInstanceName: xsuaa
    service-manager:
      serviceInstanceName: service-manager
  image:
    repository: misha2012/incident-management-srv
  resources:
    limits:
      ephemeral-storage: 1G
      memory: 500M
    requests:
      ephemeral-storage: 1G
      cpu: 500m
      memory: 500M
  health:
    liveness:
      path: /health
    readiness:
      path: /health
sidecar:
  bindings:
    auth:
      serviceInstanceName: xsuaa
    saas-registry:
      serviceInstanceName: saas-registry
    service-manager:
      serviceInstanceName: service-manager
    html5-apps-repo-host:
      serviceInstanceName: html5-apps-repo-host
    html5-apps-repo-runtime:
      serviceInstanceName: html5-apps-repo-runtime
  image:
    repository: misha2012/incident-management-sidecar
  resources:
    limits:
      ephemeral-storage: 1G
      memory: 500M
    requests:
      ephemeral-storage: 1G
      cpu: 500m
      memory: 500M
  health:
    liveness:
      path: /health
    readiness:
      path: /health
  env:
    SUBSCRIPTION_URL: https://${tenant_subdomain}-{{ .Release.Name }}-srv-{{ .Release.Namespace }}.{{ .Values.global.domain }}
xsuaa:
  serviceOfferingName: xsuaa
  servicePlanName: application
  parameters:
    tenant-mode: shared
    oauth2-configuration:
      redirect-uris:
        - https://*.{{ tpl .Values.global.domain . }}/**
    xsappname: incident-management-{{ .Release.Namespace }}
service-manager:
  serviceOfferingName: service-manager
  servicePlanName: container
saas-registry:
  serviceOfferingName: saas-registry
  servicePlanName: application
  parameters:
    appName: incident-management-{{ .Release.Namespace }}
    xsappname: incident-management-{{ .Release.Namespace }}
    displayName: incident-management
    description: A simple CAP October-- project.
    category: "CAP Application"
    appUrls:
      onSubscriptionAsync: true
      onUnSubscriptionAsync: true
      onUpdateDependenciesAsync: true
      callbackTimeoutMillis: 300000
      getDependencies: https://{{ .Release.Name }}-sidecar-{{ .Release.Namespace }}.{{ .Values.global.domain }}/-/cds/saas-provisioning/dependencies
      onSubscription: https://{{ .Release.Name }}-sidecar-{{ .Release.Namespace }}.{{ .Values.global.domain }}/-/cds/saas-provisioning/tenant/{tenantId}

mtx-upgrade:
  bindings:
    service-manager:
      serviceInstanceName: service-manager
  image:
    repository: misha2012/incident-management-sidecar
  resources:
    limits:
      ephemeral-storage: 1G
      memory: 1G
    requests:
      ephemeral-storage: 1G
      cpu: 1000m
      memory: 1G
  command:
    - "launcher"
  args:
    - "cds-mtx"
    - "upgrade"
    - '*'
html5-apps-repo-host:
  serviceOfferingName: html5-apps-repo
  servicePlanName: app-host
html5-apps-deployer:
  env:
     ASYNC_UPLOAD: "true"
     destinations: '[{"forwardAuthToken":true,"name":"srv-api","url":"https://incident-management-srv-incidents-namespace.c-881e383.kyma.ondemand.com"}]'
  image:
    repository: misha2012/incident-management-html5-deployer
  bindings:
    xsuaa:
      serviceInstanceName: xsuaa
    html5-apps-repo:
      serviceInstanceName: html5-apps-repo-host
  resources:
    limits:
      cpu: 2000m
      memory: 1G
    requests:
      cpu: 1000m
      memory: 1G
html5-apps-repo-runtime: 
  serviceOfferingName: html5-apps-repo
  servicePlanName: app-runtime